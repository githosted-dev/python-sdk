[project]
name = "githosted"
version = "0.1.0"
description = "Python SDK for githosted — git-backed file storage for AI agents"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
license = "MIT"
readme = "README.md"
authors = [{ name = "githosted" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://githosted.dev"
Documentation = "https://docs.githosted.dev/sdks/python/"
Repository = "https://github.com/githosted-dev/python-sdk"
Issues = "https://github.com/githosted-dev/python-sdk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
